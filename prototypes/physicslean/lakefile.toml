[[lean_lib]]
name = "HzRoundoff"
srcDir = "src"

[[lean_lib]]
name = "HzRoundoffExamples"
srcDir = "generated"

[[lean_lib]]
name = "HzNative"
srcDir = "src"

[[lean_lib]]
name = "HzExceptional"
srcDir = "src"

