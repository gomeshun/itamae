name: PhysicsLean

on:
  push:
    paths:
      - 'prototypes/physicslean/**'
      - 'src/itamae/cosmology/certified.py'
      - 'tests/test_certified_cosmology.py'
      - '.github/workflows/physicslean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/physicslean
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Lake
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.36.0/lean-4.36.0-linux.tar.zst
          echo "2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb  lean.tar.zst" | sha256sum -c
          tar -xf lean.tar.zst
          rm lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.36.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch locked dependencies and mathlib cache
        run: python3 scripts/fetch_mathlib_cache.py HzAudit
      - name: Build and check proofs
        run: ./run_demo.sh
      - name: Kernel replay on published FDM knots and the independent CAMB cusp fixture
        run: |
          python3 scripts/table_window.py tests/data/fdm-camb-three-knots.dat --format camb --h .674 --model fdm --radius-lower 1 --radius-upper 1.001 --bits 64 --degree 8 --tolerance 1 --replay
          python3 scripts/cusp_moments.py tests/data/camb_cdm31.csv --edges inside --k-max .15 --redshift 0 --depth 6 --bits 48 --degree 15 --tolerance .25 --quantities radius gamma --certificate "$RUNNER_TEMP/CuspInput.lean"
      - name: Verify all five benchmark cases and reject a corrupted certificate
        run: python3 scripts/benchmark.py --repeats 1 --output "$RUNNER_TEMP/benchmarks.json"
      - name: Verify spectra from the SASHIMI family revisions
        run: |
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/gomeshun/sashimi-w/d234ae250f4343e465be483c5a960d12ea5d3dbf/WMAP7_camb_matterpower_z0_extrapolated.dat' -o "$RUNNER_TEMP/w.dat"
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/gomeshun/sashimi-f/fc4cd832acf4b4ae4b7ff02691d326e63945dc6d/data/Planck2018_CAMB_extrap.dat' -o "$RUNNER_TEMP/f.dat"
          python3 scripts/verify_sashimi_tables.py "$RUNNER_TEMP/w.dat" "$RUNNER_TEMP/f.dat" --output "$RUNNER_TEMP/sashimi-tables.json"
      - name: Replay the complete 3000-row FDM spectrum with the kernel
        run: |
          python3 scripts/table_window.py "$RUNNER_TEMP/f.dat" --format camb --h .674 --model fdm --radius-lower 1 --radius-upper 1.001 --tolerance 3 --depth 0 --bits 80 --degree 8 --replay --replay-chunk-cells 16 --replay-jobs 2 > "$RUNNER_TEMP/fdm-kernel.json"
      - name: Save measurements
        uses: actions/upload-artifact@v4
        with:
          name: physicslean-benchmarks
          path: |
            ${{ runner.temp }}/benchmarks.json
            ${{ runner.temp }}/sashimi-tables.json
            ${{ runner.temp }}/fdm-kernel.json
