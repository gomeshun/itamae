name: Apply sashimi-itamae rename docs (temporary)
on:
  push:
    branches: [packaging/sashimi-itamae-20260909]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packaging/sashimi-itamae-20260909
      - name: Update notebook and packaging guidance
        env:
          PINNED_RENAME_SHA: b682ceaab0b70a20ff43310e77bba76a1def6952
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          pin = os.environ["PINNED_RENAME_SHA"]

          notebook = Path("notebooks/usage_walkthrough.ipynb")
          text = notebook.read_text()
          old = 'version(\\"itamae\\")'
          new = 'version(\\"sashimi-itamae\\")'
          if old not in text:
              raise RuntimeError("ITAMAE metadata-version lookup was not found in walkthrough")
          notebook.write_text(text.replace(old, new, 1))

          readme = Path("README.md")
          text = readme.read_text()
          old = '''The PyPI distribution rename is a release blocker tracked in
[#3](https://github.com/gomeshun/itamae/issues/3); the Python import namespace
remains `itamae` during development.'''
          new = '''The public Python **distribution** is named `sashimi-itamae` to avoid the
unrelated PyPI project named `itamae`. The Python **import namespace** remains
`itamae`. This packaging decision is tracked in
[#3](https://github.com/gomeshun/itamae/issues/3).'''
          if old not in text:
              raise RuntimeError("README status text was not found")
          text = text.replace(old, new, 1)
          old = '''The SASHIMI ITAMAE core is not released on PyPI. That distribution name is
occupied by an unrelated project, so do not install it by an unqualified index
name. Use the reviewed source revision for reproducible development:

```bash
uv pip install "itamae[full] @ git+https://github.com/gomeshun/itamae.git@1c5b1ad67725671fd4dc1a2306d2731ba337e563"
```'''
          new = f'''The SASHIMI ITAMAE core is not yet released on PyPI. Its collision-free
distribution name is `sashimi-itamae`, while code continues to use
`import itamae`. Until publication, install an exact reviewed VCS revision:

```bash
uv pip install "sashimi-itamae[full] @ git+https://github.com/gomeshun/itamae.git@{pin}"
python -c "import itamae; print(itamae.__version__)"
```

Do **not** install bare `itamae` from PyPI; that name belongs to an unrelated
project. Downstream SASHIMI package metadata should depend on `sashimi-itamae`,
but Python imports do not change.'''
          if old not in text:
              raise RuntimeError("README installation block was not found")
          readme.write_text(text.replace(old, new, 1))

          plan = Path("PLAN.md")
          text = plan.read_text()
          old = '''ITAMAE is intended for publication under a collision-free distribution name
selected in [GOV-02 / #3](https://github.com/gomeshun/itamae/issues/3). The current
metadata still says `itamae`, but that PyPI name belongs to an unrelated
project. The Python import namespace can remain `itamae`. No new distribution
identity is selected by this document.'''
          new = '''ITAMAE uses the collision-free public distribution name `sashimi-itamae`,
selected in [GOV-02 / #3](https://github.com/gomeshun/itamae/issues/3). The
Python import namespace remains `itamae`. The unrelated PyPI distribution named
`itamae` must never be used as the SASHIMI core dependency.'''
          if old not in text:
              raise RuntimeError("PLAN packaging decision block was not found")
          text = text.replace(old, new, 1)
          text = text.replace('name = "itamae"', 'name = "sashimi-itamae"', 1)
          old = '''Install the reviewed development source explicitly until the naming issue is
resolved. Do not use `uv add itamae` to obtain the SASHIMI core from PyPI.

```bash
uv pip install "itamae[full] @ git+https://github.com/gomeshun/itamae.git@1c5b1ad67725671fd4dc1a2306d2731ba337e563"
```'''
          new = f'''Install the reviewed development source explicitly until `sashimi-itamae` is
published. Do not use `uv add itamae`; the import name and distribution name are
deliberately different. Downstream requirements use `sashimi-itamae`, while
Python code continues to import `itamae`.

```bash
uv pip install "sashimi-itamae[full] @ git+https://github.com/gomeshun/itamae.git@{pin}"
```'''
          if old not in text:
              raise RuntimeError("PLAN installation block was not found")
          plan.write_text(text.replace(old, new, 1))
          PY
      - name: Commit documentation updates
        run: |
          if git diff --quiet -- README.md PLAN.md notebooks/usage_walkthrough.ipynb; then
            echo "rename documentation already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PLAN.md notebooks/usage_walkthrough.ipynb
          git commit -m "docs: document sashimi-itamae distribution identity"
          git push origin HEAD:packaging/sashimi-itamae-20260909
