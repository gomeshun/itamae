name: Format provenance review fix (temporary)
on:
  push:
    branches: [packaging/sashimi-itamae-20260909]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packaging/sashimi-itamae-20260909
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run ruff format src/itamae/provenance.py tests/test_provenance.py
      - name: Commit formatter result
        run: |
          if git diff --quiet -- src/itamae/provenance.py tests/test_provenance.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/itamae/provenance.py tests/test_provenance.py
          git commit -m "style: format provenance normalization fix"
          git push origin HEAD:packaging/sashimi-itamae-20260909
