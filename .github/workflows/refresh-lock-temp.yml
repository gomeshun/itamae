name: Refresh lock for sashimi-itamae rename (temporary)
on:
  push:
    branches: [packaging/sashimi-itamae-20260909]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packaging/sashimi-itamae-20260909
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
      - name: Commit regenerated lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lock for distribution rename"
          git push origin HEAD:packaging/sashimi-itamae-20260909
