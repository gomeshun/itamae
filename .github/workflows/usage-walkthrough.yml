name: Usage walkthrough
on:
  pull_request:
  push:
    branches: [main, itamae-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          export ITAMAE_SOURCE_REVISION="$(git rev-parse HEAD)"
          python -m pip install . numpy scipy matplotlib astropy colossus h5py numexpr tqdm nbformat nbclient ipykernel
      - name: Execute all cells from outside the source checkout
        run: python scripts/execute_walkthrough.py
      - uses: actions/upload-artifact@v4
        with:
          name: itamae-usage-walkthrough
          path: artifacts/usage_walkthrough.executed.ipynb
          if-no-files-found: error
