name: Usage walkthrough
'on':
  pull_request: null
  push:
    branches:
    - main
    - itamae-migration
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: gomeshun/sashimi-family/.github/actions/changed-paths@e915092597d074aaaf0489b74710b1e1e664667c
      id: changes
      with:
        paths: |
          src/**
          *.py
          *.toml
          *.cfg
          MANIFEST.in
          uv.lock
          requirements*.txt
          data/**
          .github/workflows/usage-walkthrough.yml
          .github/actions/**
          notebooks/usage_walkthrough.ipynb
          scripts/execute_walkthrough.py
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
      if: steps.changes.outputs.changed == 'true'
    - name: Install candidate and notebook dependencies
      run: |
        python -m pip install --upgrade pip
        export ITAMAE_SOURCE_REVISION="$(git rev-parse HEAD)"
        python -m pip install '.[demo]' nbformat nbclient
      if: steps.changes.outputs.changed == 'true'
    - name: Execute all cells from outside the source checkout
      run: python scripts/execute_walkthrough.py
      if: steps.changes.outputs.changed == 'true'
    - uses: actions/upload-artifact@v4
      with:
        name: itamae-usage-walkthrough
        path: artifacts/usage_walkthrough.executed.ipynb
        if-no-files-found: error
      if: steps.changes.outputs.changed == 'true'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name
    == 'workflow_dispatch' && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
