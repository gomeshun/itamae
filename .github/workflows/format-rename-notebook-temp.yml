name: Format rename notebook (temporary)
on:
  push:
    branches: [packaging/sashimi-itamae-20260909]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packaging/sashimi-itamae-20260909
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff format notebooks/usage_walkthrough.ipynb
      - name: Commit formatter result
        run: |
          if git diff --quiet -- notebooks/usage_walkthrough.ipynb; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/usage_walkthrough.ipynb
          git commit -m "style: format renamed walkthrough metadata"
          git push origin HEAD:packaging/sashimi-itamae-20260909
