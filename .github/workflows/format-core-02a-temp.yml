name: format-core-02a-temp

on:
  push:
    branches: [architecture/core-02a-components-20260909]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/core-02a-components-20260909
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run ruff format tests/test_execution_composition.py
      - name: Commit formatted file
        run: |
          if git diff --quiet -- tests/test_execution_composition.py; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_execution_composition.py
          git commit -m "style: apply ruff formatter"
          git push origin HEAD:architecture/core-02a-components-20260909
