name: Format walkthrough sources (temporary)
on:
  push:
    branches: [docs/usage-walkthrough-20260907]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/usage-walkthrough-20260907
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff format notebooks/usage_walkthrough.ipynb scripts/execute_walkthrough.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/usage_walkthrough.ipynb scripts/execute_walkthrough.py
          git commit -m 'style: apply ruff formatter to walkthrough'
          git push origin HEAD:docs/usage-walkthrough-20260907
